# porth's configuration: the [porth] table (design.md §4.3). Development values;
# a production deployment mounts its own copy, secrets included (docs/user-manual,
# Configuration). Unknown keys and wrong types stop startup.

[porth]
db = "postgresql+asyncpg://porth:porth@localhost:5432/porth"  # compose's postgres
log_level = "DEBUG"

[porth.http]
host = "0.0.0.0"
port = 8080

[porth.kannel]
host = "0.0.0.0"
port = 13013
# default_sender = "ACME"  # quoted: a bare number is not a string

[porth.delivery]
max_retries = 3
retry_delay = 5
backoff_factor = 2
max_retry_delay = 300
worker_count = 10  # per SMSC

[porth.mo]
# url = "http://localhost:8000/mo?from=%p&to=%P&text=%a&coding=%C"
reply = true

# Message records: a sent message with no delivery receipt after dlr_timeout_hours
# becomes expired; a finished one is deleted retention_days after it was created.
# [porth.store]
# dlr_timeout_hours = 48
# retention_days = 7

# SMSCs, one table each, named by the table's key; without any, porth accepts no
# message (nothing routes). compose's smppai SMSC accepts any system_id/password
# (publish its port 2775 to bind from the host).
# [porth.smsc.local]
# host = "localhost"
# port = 2775
# system_id = "porth"
# password = "secret"
# system_type = ""
# throughput = 50  # submit_sm PDUs/s; unset = unlimited

# Which SMSC a number goes out through: the longest matching prefix (digits, matched
# without a leading +), else default.
# [porth.routing]
# default = "local"
# [porth.routing.prefixes]
# "30" = "local"
