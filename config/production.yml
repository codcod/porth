# Production Configuration
# db: "postgresql+asyncpg://USER:PASSWORD@HOST:5432/porth"  # or PORTH_DB

http:
  host: "0.0.0.0"
  port: 8080

kannel:
  host: "0.0.0.0"
  port: 13013

smpp:
  clients:
    - host: "${SMSC_HOST}"
      port: 2775
      system_id: "${SMSC_SYSTEM_ID}"
      password: "${SMSC_PASSWORD}"

delivery:
  max_retries: 5
  retry_delay: 10
  backoff_factor: 2
  max_retry_delay: 300
  worker_count: 10
  # throughput: 50  # submit_sm PDUs/s: the operator's contracted rate; unset = unlimited

mo:
  # url: "${MO_URL}"
  reply: true

# Production-specific settings
debug: false
log_level: "INFO"
