# Production Configuration
http:
  host: "0.0.0.0"
  port: 8080

kannel:
  host: "0.0.0.0"
  port: 13013

smpp:
  clients:
    - host: "${SMSC_HOST}"
      port: 2775
      system_id: "${SMSC_SYSTEM_ID}"
      password: "${SMSC_PASSWORD}"

delivery:
  max_retries: 5
  retry_delay: 10
  backoff_factor: 2
  max_retry_delay: 300
  worker_count: 10

mo:
  # url: "${MO_URL}"
  reply: true

# Production-specific settings
debug: false
log_level: "INFO"
