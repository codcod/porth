# porth's Alembic configuration. Run it as a one-off step (make migrate), never at
# application startup.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# No sqlalchemy.url: migrations/env.py reads the DSN from porth's settings (the `db`
# setting: PORTH_DB, or `db:` in the PORTH_CONFIG_FILE YAML), so there is exactly one
# place the database connection is configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
