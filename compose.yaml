# porth's PostgreSQL for development (porth itself runs on the host, not in compose):
#
#   make db-up      # docker compose up -d --wait postgres
#   make migrate
#
# The reference Kannel is compose-kannel.yaml; the demos are compose-demo*.yaml.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: porth
      POSTGRES_PASSWORD: porth
      POSTGRES_DB: porth
    # POSTGRES_PORT: another host port (then change db in config/config.toml to match).
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porth -d porth"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
