books:
  - src: docs/user-manual.adoc
    out: porth-user-manual
theme: docs/pdf-theme/porth-theme.yml
attributes:
  toc: left
  sectnums: ""
formats: [pdf, epub]
revision:
  from: git-describe
  date-format: "%d %B %Y"
mermaid:
  format: png
  puppeteer-args: ["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
failure-level:
  pdf: WARN
  epub: ERROR
  check: WARN
