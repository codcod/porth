# An overlay on compose-demo.yaml that adds users to both APIs: a Bearer token on the REST
# API (/api/v1) and a username/password on Kannel's sendsms. Once a [porth.http.users.*]
# or [porth.kannel.users.*] table exists, that API refuses any caller without credentials.
# /health, /ready, /status, /metrics and /admin stay open. The token and password are demo
# values.
#
#   docker compose -f compose-demo.yaml -f compose-demo-auth.yaml up -d
#   until curl -sf localhost:8080/ready; do sleep 1; done
#
#   # REST: no token is a 401, the token is accepted
#   curl -si -X POST localhost:8080/api/v1/sms/send -H 'Content-Type: application/json' \
#     -d '{"from_number":"ACME","to_number":"306900000000","message":"hello"}'
#   curl -s -X POST localhost:8080/api/v1/sms/send -H 'Content-Type: application/json' \
#     -H 'Authorization: Bearer demo-token-0123456789abcdef' \
#     -d '{"from_number":"ACME","to_number":"306900000000","message":"hello"}'
#
#   # Kannel: no or a wrong password is a 403, the right one is accepted
#   curl -si 'localhost:13013/cgi-bin/sendsms?from=ACME&to=306900000000&text=hi'
#   curl -s 'localhost:13013/cgi-bin/sendsms?username=acme&password=demo-secret&from=ACME&to=306900000000&text=hi'
#
#   docker compose -f compose-demo.yaml logs porth | grep 'authorization failed'
#
#   # Load: make perf-demo-auth (both APIs, with and without credentials)
#
#   docker compose -f compose-demo.yaml down -v
#
# Compose replaces config.toml whole rather than merging it, so the settings below repeat
# compose-demo.yaml's. Compose doesn't notice a changed config, so to add or drop the users
# on a running demo, add --force-recreate porth to up.
# allow_ip is left out: a request through a published port comes from Docker's gateway,
# not 127.0.0.1.

configs:
  config.toml:
    content: |
      [porth]
      db = "postgresql+asyncpg://porth:porth@postgres:5432/porth"
      log_level = "INFO"

      # One table per REST caller, under any name: "Authorization: Bearer <token>"
      [porth.http.users.app]
      token = "demo-token-0123456789abcdef"  # at least 16 characters, unique per user

      # One table per sendsms user, named by its username
      [porth.kannel.users.acme]
      password = "demo-secret"

      [porth.smsc.sim]
      host = "smsc"
      port = 2775
      system_id = "porth"
      password = "demo"

      [porth.routing]
      default = "sim"
