# Build the Dockerfile for linux/amd64 and linux/arm64 and push it to ghcr.io/codcod/porth
# on every version tag.
#
# Tags: `v0.3.0` publishes `ghcr.io/codcod/porth:0.3.0` and `:latest`. `workflow_dispatch`
# republishes an existing tag's version tag only, so republishing an old tag never moves
# `:latest` back to it.
#
# One-time step after the first publish: a first push can create the package as private,
# and a workflow token can't change that. Open the package on GitHub → Package settings →
# Change visibility → Public.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish the image for, e.g. v0.2.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # No native arm runners: arm64 builds under QEMU emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI labels (org.opencontainers.image.source, version, revision) for each platform
      # image. Pushing with this repository's GITHUB_TOKEN is what links the package to it.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/codcod/porth
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
